openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Fees
  description: CQ queries and registration for product fees
- name: Pricing
  description: CQ queries and registration for product pricing
- name: Eligibility
  description: CQ queries and registration for product eligibility
paths:
  /api/v1/pricing/{pricingId}:
    put:
      tags:
      - Pricing
      summary: Amend pricing
      description: Amend rates/margins/tiers by creating a new effective version.
      operationId: amendPricing
      parameters:
      - name: pricingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductPricingCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/pricing/fees/schemes/{schemeId}/components/{componentId}:
    put:
      tags:
      - Fees
      summary: Update fee rule
      description: Update a specific fee calculation rule.
      operationId: updateFeeRule
      parameters:
      - name: schemeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: componentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeeApplicationRuleCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/pricing:
    post:
      tags:
      - Pricing
      summary: Register pricing
      description: Create rates with tiers and effectiveFrom date.
      operationId: registerPricing
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProductPricingCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/pricing/fees/schemes:
    post:
      tags:
      - Fees
      summary: Define fee scheme
      description: Define fee types and calculation rules.
      operationId: defineFeeScheme
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterFeeSchemaCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/pricing/eligibility:
    post:
      tags:
      - Eligibility
      summary: Publish eligibility criteria
      description: "Publish eligibility rules (KYC/KYB, score, income, activity)."
      operationId: publishEligibility
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishEligibilityCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/pricing/eligibility/{eligibilityId}/evaluate:
    post:
      tags:
      - Eligibility
      summary: Evaluate eligibility
      description: Evaluate applicant facts and return fit/not-fit with reasons.
      operationId: evaluateEligibility
      parameters:
      - name: eligibilityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateEligibilityCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EligibilityResultDTO"
  /api/v1/pricing/eligibility/{eligibilityId}:
    patch:
      tags:
      - Eligibility
      summary: Adjust eligibility criteria
      description: Adjust criteria with versioning.
      operationId: adjustEligibility
      parameters:
      - name: eligibilityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustEligibilityCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
components:
  schemas:
    UpdateProductPricingCommand:
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        productConfigurationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        configType:
          type: string
          enum:
          - PRICING
          - LIMITS
          - FEATURES
          - CUSTOM
        configKey:
          type: string
        configValue:
          type: string
        productPricingId:
          type: string
          format: uuid
    UpdateFeeApplicationRuleCommand:
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        productConfigurationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        configType:
          type: string
          enum:
          - PRICING
          - LIMITS
          - FEATURES
          - CUSTOM
        configKey:
          type: string
        configValue:
          type: string
        feeApplicationRuleId:
          type: string
          format: uuid
        feeComponentId:
          type: string
          format: uuid
    RegisterProductPricingCommand:
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        productConfigurationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        configType:
          type: string
          enum:
          - PRICING
          - LIMITS
          - FEATURES
          - CUSTOM
        configKey:
          type: string
        configValue:
          type: string
    RegisterFeeApplicationRuleCommand:
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        productConfigurationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        configType:
          type: string
          enum:
          - PRICING
          - LIMITS
          - FEATURES
          - CUSTOM
        configKey:
          type: string
        configValue:
          type: string
        feeComponentId:
          type: string
          format: uuid
    RegisterFeeComponentCommand:
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        productConfigurationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        configType:
          type: string
          enum:
          - PRICING
          - LIMITS
          - FEATURES
          - CUSTOM
        configKey:
          type: string
        configValue:
          type: string
        feeStructureId:
          type: string
          format: uuid
    RegisterFeeSchemaCommand:
      type: object
      properties:
        feeApplicationRule:
          $ref: "#/components/schemas/RegisterFeeApplicationRuleCommand"
        feeStructure:
          $ref: "#/components/schemas/RegisterFeeStructureCommand"
        feeComponent:
          $ref: "#/components/schemas/RegisterFeeComponentCommand"
        productFeeStructure:
          $ref: "#/components/schemas/RegisterProductFeeStructureCommand"
    RegisterFeeStructureCommand:
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        productConfigurationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        configType:
          type: string
          enum:
          - PRICING
          - LIMITS
          - FEATURES
          - CUSTOM
        configKey:
          type: string
        configValue:
          type: string
    RegisterProductFeeStructureCommand:
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        productConfigurationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        configType:
          type: string
          enum:
          - PRICING
          - LIMITS
          - FEATURES
          - CUSTOM
        configKey:
          type: string
        configValue:
          type: string
        feeStructureId:
          type: string
          format: uuid
    PublishEligibilityCommand:
      type: object
    EvaluateEligibilityCommand:
      required:
      - partyId
      - productId
      - requestedAmount
      type: object
      properties:
        partyId:
          type: string
          description: Identifier of the applicant party
          format: uuid
          example: 6c04e2bc-5523-4bc7-9002-528f2dbe3229
        productId:
          type: string
          description: Identifier of the product being evaluated
          format: uuid
          example: 00000000-0000-0000-0000-00000000000a
        requestedAmount:
          type: number
          description: Principal amount the applicant is requesting
          example: 10000
      description: Applicant facts used to evaluate eligibility for a product
    EligibilityResultDTO:
      type: object
      properties:
        evaluationId:
          type: string
          description: Identifier assigned to this evaluation
          format: uuid
          example: 0c3a5d3b-7c2c-4dca-8e2f-1e4d8a4d0b1a
        eligible:
          type: boolean
          description: Whether the applicant is eligible for the product with the
            requested amount
          example: true
        maxAmount:
          type: number
          description: Maximum amount the product allows for this applicant
          example: 60000
        reasons:
          type: array
          description: Codes describing why the applicant is not eligible (empty when
            eligible)
          example:
          - AMOUNT_ABOVE_MAXIMUM
          items:
            type: string
            description: Codes describing why the applicant is not eligible (empty
              when eligible)
            example: "[\"AMOUNT_ABOVE_MAXIMUM\"]"
      description: Outcome of a product eligibility evaluation
    AdjustEligibilityCommand:
      type: object
